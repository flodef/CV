<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flojito Stillnet - CV</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./vendor/tabler-icons/tabler-icons.css" />
    <link
      rel="preload"
      href="./vendor/tabler-icons/fonts/tabler-icons.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Helvetica Neue", sans-serif;
        background: #ffffff;
        color: #333333;
      }

      #net {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }

      #net.dragging {
        cursor: grabbing;
      }

      /* ---------- bouton info ---------- */
      #infoBtn,
      #themeBtn,
      #printBtn,
      #searchBtn {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid #e2e8f0;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(6px);
        color: #475569;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
        transition: transform 0.15s ease, color 0.15s ease;
        z-index: 50;
      }

      #infoBtn:hover,
      #themeBtn:hover,
      #printBtn:hover,
      #searchBtn:hover {
        transform: scale(1.08);
        color: #007bff;
      }

      #themeBtn {
        right: 76px;
      }

      #printBtn {
        right: 132px;
      }

      #searchBtn {
        right: 188px;
      }

      #searchBtn.active {
        color: #007bff;
        border-color: #007bff;
      }

      /* ---------- barre de recherche ---------- */
      #searchBar {
        position: fixed;
        right: 240px;
        bottom: 20px;
        z-index: 50;
        width: 0;
        height: 46px;
        display: flex;
        align-items: center;
        opacity: 0;
        overflow: hidden;
        transition:
          width 1s cubic-bezier(0.42, 0, 0.58, 1),
          opacity 0.25s ease 0.75s;
      }

      #searchBar.open {
        width: min(200px, calc(100vw - 260px));
        opacity: 1;
        transition:
          width 1.4s cubic-bezier(0.42, 0, 0.58, 1),
          opacity 0.35s ease;
      }

      #searchBarInner {
        width: 100%;
        height: 38px;
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0 5px 0 12px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.15);
      }

      #searchInput {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        font: inherit;
        font-size: 13px;
        color: #1f2937;
      }

      #searchInput::placeholder {
        color: #94a3b8;
      }

      #searchClear {
        flex: none;
        border: 0;
        background: none;
        color: #94a3b8;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        width: 0;
        padding: 0;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transition:
          width 0.18s ease,
          padding 0.18s ease,
          opacity 0.15s ease;
      }

      #searchBar.filled #searchClear {
        width: 27px;
        padding: 6px;
        opacity: 1;
        pointer-events: auto;
      }

      #searchClear:hover {
        color: #334155;
        background: #f1f5f9;
      }

      body.night #searchBarInner {
        background: rgba(15, 23, 42, 0.94);
        border-color: #1e293b;
      }

      body.night #searchInput {
        color: #e2e8f0;
      }

      body.night #searchInput::placeholder {
        color: #64748b;
      }

      body.night #searchClear {
        color: #64748b;
      }

      body.night #searchClear:hover {
        color: #e2e8f0;
        background: #1e293b;
      }

      body.night #searchBtn.active {
        color: #60a5fa;
        border-color: #60a5fa;
      }

      /* ---------- panneau info ---------- */
      #infoPanel {
        position: fixed;
        right: 20px;
        bottom: 76px;
        width: 280px;
        max-width: calc(100vw - 40px);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.15);
        padding: 16px 18px;
        font-size: 0.85em;
        color: #475569;
        z-index: 50;
        display: none;
        max-height: calc(100vh - 110px);
        overflow-y: auto;
      }

      #infoPanel.open {
        display: block;
      }

      #infoPanel h3 {
        margin: 0 0 8px;
        font-size: 0.95em;
        color: #0f172a;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding-right: 30px;
      }

      .panel-ver {
        font-size: 0.72em;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      #infoPanel h4 {
        margin: 14px 0 6px;
        font-size: 0.8em;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #94a3b8;
      }

      .panel-close {
        position: absolute;
        top: 8px;
        right: 10px;
        cursor: pointer;
        color: #94a3b8;
        font-size: 22px;
      }

      .panel-close:hover {
        color: #334155;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        border: none;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
      }

      .legend-item:hover {
        background: #f1f5f9;
      }

      .legend-item.active {
        background: #eff6ff;
        color: #1d4ed8;
        font-weight: bold;
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }

      .panel-hint {
        line-height: 1.7;
        margin: 0;
        padding-left: 18px;
      }

      .panel-btns {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .panel-btn {
        border: 1px solid #e2e8f0;
        background: #fff;
        border-radius: 7px;
        padding: 5px 10px;
        font-size: 0.8em;
        color: #475569;
        cursor: pointer;
      }

      .panel-btn:hover {
        border-color: #007bff;
        color: #007bff;
      }

      /* ---------- modal ---------- */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(3px);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal-content {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 24px 28px;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.18);
        max-width: 520px;
        width: calc(100% - 48px);
        max-height: 82vh;
        overflow-y: auto;
        position: relative;
      }

      .modal-label {
        font-size: 1.45em;
        font-weight: bold;
        color: #007bff;
        margin-bottom: 2px;
        padding-right: 30px;
      }

      .modal-label.flo {
        color: #0f172a;
      }

      .modal-sub {
        font-size: 0.85em;
        color: #64748b;
        margin-bottom: 14px;
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .modal-head + .meta-line {
        margin-top: 12px;
      }

      .modal-head .active-badge {
        flex: none;
        margin: 0 0 8px;
        transform: translateX(-24px);
        animation: badge-pulse 1.6s ease-in-out infinite;
      }

      @keyframes badge-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      .modal-footer a .go-chev {
        display: inline-block;
        font-size: 2.1em;
        font-weight: 800;
        margin-left: 5px;
        text-decoration: none;
        vertical-align: -4px;
      }

      @media (max-width: 560px) {
        .modal-head {
          flex-direction: column;
          align-items: flex-start;
          gap: 0;
        }
        .modal-head .active-badge {
          margin: 0 0 8px;
          transform: none;
        }
      }

      .meta-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.92em;
        color: #334155;
        margin-bottom: 8px;
      }

      .sector-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid #e2e8f0;
        background: #fff;
        border-radius: 999px;
        padding: 3px 12px 3px 8px;
        font-size: 0.85em;
        font-weight: bold;
        color: #334155;
        cursor: pointer;
      }

      .sector-chip:hover {
        border-color: #94a3b8;
      }

      .sector-chip .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .meta-line .lbl {
        color: #94a3b8;
        font-size: 0.8em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        width: 62px;
        flex: none;
      }

      .modal-comment {
        font-size: 0.95em;
        line-height: 1.55;
        color: #334155;
        margin: 14px 0;
      }

      .modal-footer {
        font-size: 0.85em;
        color: #64748b;
        border-top: 1px solid #e2e8f0;
        padding-top: 0;
        line-height: 1.8;
      }

      .modal-footer a {
        color: #007bff;
        font-weight: 800;
      }

      .modal-section {
        margin-bottom: 12px;
      }

      .modal-section h4 {
        margin: 0 0 4px;
        font-size: 0.78em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
      }

      .modal-section p {
        margin: 0;
        font-size: 0.9em;
        line-height: 1.6;
        color: #334155;
      }

      .modal-close {
        position: absolute;
        top: 12px;
        right: 14px;
        cursor: pointer;
        font-size: 22px;
        color: #94a3b8;
      }

      .modal-close:hover {
        color: #334155;
      }

      .map-toggle {
        cursor: pointer;
        color: #94a3b8;
        font-size: 16px;
        display: inline-flex;
      }

      .map-toggle:hover {
        color: #007bff;
      }

      .acc-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 9px 4px;
        border: none;
        background: none;
        font: inherit;
        font-weight: bold;
        color: #0f172a;
        cursor: pointer;
        text-align: left;
      }

      .acc-head .ti {
        color: #94a3b8;
        transition: transform 0.2s ease;
      }

      .acc-hint {
        font-weight: normal;
        font-size: 0.85em;
        margin-left: 3px;
        cursor: help;
        vertical-align: -1px;
      }

      .acc.open .acc-head .ti-chevron-down {
        display: none;
      }

      .acc-body {
        display: none;
        padding-bottom: 10px;
      }

      .acc.open .acc-body {
        display: block;
      }

      .active-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.72em;
        font-weight: bold;
        color: #047857;
        margin: 0 0 8px;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #047857;
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.75);
        }
      }

      .dur-pre {
        display: inline;
      }

      /* ---------- thème nuit ---------- */
      body.night {
        background:
          radial-gradient(ellipse 55% 45% at 18% 12%, rgba(88, 28, 135, 0.4), transparent 65%),
          radial-gradient(ellipse 50% 40% at 82% 78%, rgba(30, 58, 138, 0.35), transparent 65%),
          radial-gradient(ellipse 42% 35% at 68% 22%, rgba(8, 74, 110, 0.3), transparent 65%),
          #04060d;
        color: #e2e8f0;
      }

      body.night #infoPanel {
        background: rgba(15, 23, 42, 0.94);
        border-color: #1e293b;
        color: #cbd5e1;
      }
      body.night #infoPanel h3 { color: #f1f5f9; }
      body.night #infoPanel h4 { color: #64748b; }
      body.night .acc-head { color: #f1f5f9; }
      body.night .acc-head .ti { color: #64748b; }
      body.night .legend-item:hover { background: #1e293b; }
      body.night .legend-item.active { background: #172554; color: #93c5fd; }
      body.night .panel-hint { color: #94a3b8; }
      body.night .panel-btn { border-color: #334155; background: #0f172a; color: #cbd5e1; }
      body.night .panel-btn:hover { border-color: #60a5fa; color: #60a5fa; }
      body.night #infoBtn,
      body.night #themeBtn,
      body.night #printBtn,
      body.night #searchBtn { background: rgba(15, 23, 42, 0.85); border-color: #334155; color: #94a3b8; }
      body.night #infoBtn:hover,
      body.night #themeBtn:hover,
      body.night #printBtn:hover,
      body.night #searchBtn:hover { color: #60a5fa; }

      body.night .modal { background: rgba(2, 6, 23, 0.6); }
      body.night .modal-content { background: #0f172a; border-color: #1e293b; }
      body.night .modal-label.flo { color: #f1f5f9; }
      body.night .modal-sub { color: #94a3b8; }
      body.night .meta-line { color: #cbd5e1; }
      body.night .meta-line .lbl { color: #64748b; }
      body.night .modal-comment { color: #cbd5e1; }
      body.night .modal-footer { color: #94a3b8; border-top-color: #1e293b; }
      body.night .modal-footer a { color: #60a5fa; }
      body.night .modal-section h4 { color: #64748b; }
      body.night .modal-section p { color: #cbd5e1; }
      body.night .sector-chip { border-color: #334155; background: #1e293b; color: #e2e8f0; }
      body.night .sector-chip:hover { border-color: #64748b; }
      body.night .map-toggle { color: #64748b; }
      body.night .map-toggle:hover { color: #60a5fa; }
      body.night .modal-close { color: #64748b; }
      body.night .modal-close:hover { color: #e2e8f0; }

      @media (max-width: 600px) {
        .dur-pre {
          display: none;
        }
        .dur {
          display: block;
        }
      }

      @media (max-width: 600px) {
        #infoPanel {
          right: 12px;
          bottom: 74px;
          width: calc(100vw - 24px);
        }

        #infoBtn {
          right: 14px;
          bottom: 14px;
        }

        #themeBtn {
          right: 68px;
          bottom: 14px;
        }

        #printBtn {
          right: 122px;
          bottom: 14px;
        }

        #searchBtn {
          right: 176px;
          bottom: 14px;
        }

        #searchBar {
          right: 228px;
          bottom: 14px;
        }

        #searchBar.open {
          width: min(148px, calc(100vw - 232px));
        }

        #searchInput {
          font-size: 16px;
        }
      }

      /* ---------- version papier / PDF ---------- */
      #psheetOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(15, 23, 42, 0.6);
        overflow: auto;
        padding: 18px 12px;
      }

      #psheetOverlay.open {
        display: block;
      }

      #psheetOverlay,
      .modal-content {
        scrollbar-width: thin;
        scrollbar-color: #64748b #ffffff;
      }

      body.night #psheetOverlay,
      body.night .modal-content {
        scrollbar-color: rgba(148, 163, 184, 0.55) rgba(255, 255, 255, 0.07);
      }

      #psheetOverlay::-webkit-scrollbar,
      .modal-content::-webkit-scrollbar {
        width: 10px;
      }

      #psheetOverlay::-webkit-scrollbar-track,
      .modal-content::-webkit-scrollbar-track {
        background: #ffffff;
      }

      #psheetOverlay::-webkit-scrollbar-thumb,
      .modal-content::-webkit-scrollbar-thumb {
        background: #64748b;
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      #psheetOverlay::-webkit-scrollbar-thumb:hover,
      .modal-content::-webkit-scrollbar-thumb:hover {
        background: #475569;
        background-clip: padding-box;
      }

      body.night #psheetOverlay::-webkit-scrollbar-track,
      body.night .modal-content::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.06);
      }

      body.night #psheetOverlay::-webkit-scrollbar-thumb,
      body.night .modal-content::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.5);
      }

      body.night #psheetOverlay::-webkit-scrollbar-thumb:hover,
      body.night .modal-content::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.8);
      }

      .psheet-bar {
        position: fixed;
        top: 12px;
        left: 0;
        right: 0;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding: 0;
        pointer-events: none;
      }

      .psheet-bar button {
        pointer-events: auto;
      }

      #psheetCloseBtn {
        position: absolute;
        top: 0;
        right: 22px;
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .psheet-bar button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        padding: 9px 18px;
        cursor: pointer;
      }

      #psheetPrintBtn {
        background: #007bff;
        color: #fff;
      }

      #psheetCloseBtn {
        background: #fff;
        color: #1f2937;
      }

      .psheet-page {
        max-width: 780px;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        padding: 12mm 13mm;
        box-sizing: border-box;
      }

      @media screen and (min-width: 721px) {
        .psheet-page {
          min-height: 1102px;
          display: flex;
          flex-direction: column;
        }
        #printSheet {
          flex: 1;
          display: flex;
          flex-direction: column;
        }
        #printSheet .cv-layout {
          flex: 1 0 auto;
        }
      }

      #printSheet,
      #printSheet * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      #printSheet {
        font-family: "Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #111;
        font-size: 9.2pt;
        line-height: 1.30;
      }

      .cv-layout {
        display: flex;
        align-items: stretch;
      }

      /* ---------- colonne latérale (style cv.fr) ---------- */
      #printSheet .cv-side {
        flex: none;
        width: 66mm;
        background: #f3f5f8;
        padding: 12mm 9mm 16mm 13mm;
        margin: -12mm 0 -12mm -13mm;
        box-sizing: border-box;
        position: relative;
        isolation: isolate;
      }

      #printSheet .cv-side-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        display: block;
      }

      /* bandeau navy en haut (saigne au bord haut de page) */
      #printSheet .cv-band-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        background: #0f3669;
        height: 19mm;
        padding: 2.5mm 8mm 0;
        box-sizing: border-box;
        text-align: center;
        isolation: isolate;
      }

      #printSheet .cv-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        display: block;
      }

      #printSheet .cv-band-top .cv-name2 {
        color: #fff;
        font-size: 12pt;
        font-weight: 700;
        margin: 0 0 0.3mm;
      }

      #printSheet .cv-band-top .cv-role2 {
        color: rgba(255, 255, 255, 0.78);
        font-size: 7.8pt;
        font-weight: 600;
        margin: 0;
      }

      /* languette navy arrondie sous le bandeau (comme le modèle) */
      #printSheet .cv-band-curve {
        position: absolute;
        top: 19mm;
        left: 0;
        right: 0;
        height: 20mm;
      }

      #printSheet .cv-band-curve svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* bandeau navy en bas, haut arrondi */
      #printSheet .cv-band-bot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14mm;
        background: #0f3669;
        isolation: isolate;
      }

      #printSheet .cv-band-bot .cv-fill {
        top: -0.7mm;
        height: calc(100% + 0.7mm);
      }

      #printSheet .cv-band-bot > svg:not(.cv-fill) {
        position: absolute;
        top: -8mm;
        left: 0;
        width: 100%;
        height: 8mm;
        display: block;
      }

      #printSheet .cv-photo {
        display: block;

      });
      Object.values(byDomain).forEach((arr) =>
        arr.sort((a, b) => parseDate(a.start) - parseDate(b.start))
      );

      const nodes = PROJECTS.map((p) => {
        const di = domainIndex[p.domain];
        const list = byDomain[p.domain];
        const idx = list.indexOf(p);
        const n = list.length;
        const spread = 0.16 + 0.62 * Math.sqrt(idx / Math.max(1, n - 1));
        const ang = idx * 2.399963 + rand() * 0.6;
        const [u, v] = bases[di];
        const c = centers[di];
        const jx = (rand() - 0.5) * 0.08, jy = (rand() - 0.5) * 0.08, jz = (rand() - 0.5) * 0.08;
        let pos = [
          c[0] + (u[0] * Math.cos(ang) + v[0] * Math.sin(ang)) * spread + jx,
          c[1] + (u[1] * Math.cos(ang) + v[1] * Math.sin(ang)) * spread + jy,
          c[2] + (u[2] * Math.cos(ang) + v[2] * Math.sin(ang)) * spread + jz,
        ];
        const pl = Math.hypot(...pos);
        pos = pos.map((x) => x / pl);

        const endT = parseDate(p.end);
        const ageYears = Math.max(0, (NOW - endT) / 31557600000);
        const radiusFactor = 0.68 + 0.32 / (1 + ageYears / 5);
        pos = pos.map((x) => x * radiusFactor);

        const wr = p.w ?? 0.009 + 0.028 * Math.sqrt((p.commits || 0) / 2000);
        return {
          ...p,
          pos,
          radiusFactor,
          wr,
          color: DOMAINS[p.domain].color,
          isFlo: false,
          sx: 0, sy: 0, depth: 0, px: 0,
        };
      });

      // ---- Flo au centre, relié à tout ----
      const FLO_IDX = nodes.length;
      nodes.push({
        name: "Flojito",
        pos: [0, 0, 0],
        wr: 0.034,
        color: "#0f172a",
        isFlo: true,
        end: "now",
        domain: "flo",
        sx: 0, sy: 0, depth: 0, px: 0,
      });

      // ---- recherche plein texte (titre + contenu) ----
      const normTxt = (s) =>
        String(s)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      nodes.forEach((n) => {
        n.searchText = normTxt(
          [
            n.name,
            n.desc || "",
            DOMAINS[n.domain] ? DOMAINS[n.domain].label : "",
            ...(n.techs || []).map((t) => (TECHS[t] ? TECHS[t].label : t)),
          ].join(" ")
        );
      });
      let searchQuery = "";

      // ---- edges ----
      const edges = [];
      const nodeIdx = {};
      nodes.forEach((n, i) => (nodeIdx[n.name] = i));

      Object.values(byDomain).forEach((list) => {
        for (let i = 0; i < list.length - 1; i++) {
          const a = nodeIdx[list[i].name], b = nodeIdx[list[i + 1].name];
          const shared = list[i].techs.filter((t) => list[i + 1].techs.includes(t));
          edges.push({ a, b, w: 1 + Math.min(1.5, shared.length * 0.5), chrono: false, flo: false });
        }
      });
      for (let i = 0; i < FLO_IDX; i++) {
        for (let j = i + 1; j < FLO_IDX; j++) {
          if (nodes[i].domain === nodes[j].domain) continue;
          const shared = nodes[i].techs.filter((t) => nodes[j].techs.includes(t));
          if (shared.length >= 2) {
            edges.push({ a: i, b: j, w: 0.8 + shared.length * 0.4, chrono: false, flo: false });
          }
        }
      }
      const chronoSorted = [...nodes.slice(0, FLO_IDX)].sort(
        (a, b) => parseDate(a.start) - parseDate(b.start)
      );
      for (let i = 0; i < chronoSorted.length - 1; i++) {
        edges.push({
          a: nodeIdx[chronoSorted[i].name],
          b: nodeIdx[chronoSorted[i + 1].name],
          w: 0.35,
          chrono: true,
          flo: false,
        });
      }
      // spokes Flo → chaque projet
      for (let i = 0; i < FLO_IDX; i++) {
        edges.push({ a: FLO_IDX, b: i, w: 0.2, chrono: false, flo: true });
      }

      /* ---- état ---- */
      let W = 0, H = 0, DPR = 1;
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.clientWidth;
        H = canvas.clientHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      const YAW0 = 0.8, PITCH0 = 0.2, ZOOM0 = 1;
      let yaw = YAW0, pitch = PITCH0;
      let vyaw = 0, vpitch = 0;
      const CAM = 3;
      let zoom = ZOOM0, targetZoom = ZOOM0;
      let autoSpin = true;
      let lastInteract = 0;
      let hovered = -1;
      let activeFilter = null; // { kind: 'domain'|'tech', key } | null
      let camAnim = null;
      let viewOX = 0, viewOY = 0, fitScale = 1;
      let dragging = false;
      let lastX = 0, lastY = 0, downX = 0, downY = 0, downT = 0;

      function rotatePoint(p) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        let x = p[0] * cy + p[2] * sy;
        let z = -p[0] * sy + p[2] * cy;
        let y = p[1];
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const y2 = y * cp - z * sp;
        const z2 = y * sp + z * cp;
        return [x, y2, z2];
      }

      function project(p) {
        const r = rotatePoint(p);
        const s = CAM / (CAM - r[2]);
        const Rpx = Math.min(W, H) * 0.5 * zoom * fitScale;
        return {
          x: W / 2 + viewOX + r[0] * s * Rpx,
          y: H / 2 + viewOY - r[1] * s * Rpx,
          z: r[2],
          s,
          Rpx,
        };
      }

      // ---- thème nuit : étoile-field + planètes ----
      const stars = [];
      for (let i = 0; i < 180; i++) {
        stars.push({
          x: Math.random(), y: Math.random(),
          r: 0.5 + Math.random() * 1.4,
          p: Math.random() * TAU,
          s: 0.4 + Math.random() * 1.8,
          warm: Math.random() < 0.25,
        });
      }
      const mixToward = (hex, target, t) => {
        const [r, g, b] = hexRgb(hex);
        return `rgb(${Math.round(lerp(r, target[0], t))},${Math.round(lerp(g, target[1], t))},${Math.round(lerp(b, target[2], t))})`;
      };
      function planetGradient(n, x, y, r) {
        const ice = n.domain === "infra";
        const matte = n.domain === "legacy";
        const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
        g.addColorStop(0, mixToward(n.color, [255, 255, 255], matte ? 0.22 : 0.5));
        g.addColorStop(0.55, ice ? mixToward(n.color, [255, 255, 255], 0.3) : n.color);
        g.addColorStop(1, mixToward(n.color, [0, 0, 0], 0.55));
        return g;
      }

      /* ---- décor planétaire (thème nuit) ---- */
      function seeded(str) {
        let a = 0;
        for (let i = 0; i < str.length; i++) a = (a * 31 + str.charCodeAt(i)) >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const MOON_COUNT = { web: 3, pro: 2 };
      const CRATER_DOMAINS = new Set(["infra", "legacy"]);

      function nodeDecor(n) {
        if (n._dec) return n._dec;
        const rnd = seeded(n.name);
        const craters = [];
        if (CRATER_DOMAINS.has(n.domain)) {
          for (let i = 0; i < 7; i++) {
            const a = rnd() * TAU, d = Math.sqrt(rnd()) * 0.72;
            craters.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.9, r: 0.05 + rnd() * 0.1 });
          }
        }
        const moons = [];
        for (let i = 0; i < (MOON_COUNT[n.domain] || 0); i++) {
          moons.push({
            a0: rnd() * TAU,
            sp: (0.18 + rnd() * 0.3) * (rnd() < 0.5 ? -1 : 1),
            orbX: 2.0 + rnd() * 0.5,
            orbY: 0.4 + rnd() * 0.25,
            sz: 0.13 + rnd() * 0.09,
          });
        }
        n._dec = { craters, moons };
        return n._dec;
      }

      // anneau : front = arc inférieur (traverse le disque), arriere = arc supérieur
      const RING_A = 0.934, RING_B = 4.076;
      function paintRing(n, r, alpha, front) {
        ctx.globalAlpha = alpha * (front ? 0.85 : 0.55);
        ctx.strokeStyle = "rgba(203,213,225,0.55)";
        ctx.lineWidth = Math.max(1, r * 0.3);
        ctx.beginPath();
        ctx.ellipse(
          n.sx, n.sy, r * 1.85, r * 0.5, -0.35,
          front ? RING_A : RING_B, front ? RING_B : RING_A + TAU
        );
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function paintMoons(n, r, alpha, front) {
        const t = performance.now() / 1000;
        for (const m of nodeDecor(n).moons) {
          const a = m.a0 + t * m.sp;
          if ((Math.sin(a) > 0) !== front) continue;
          const mx = n.sx + Math.cos(a) * m.orbX * r;
          const my = n.sy + Math.sin(a) * m.orbY * r;
          const mr = Math.max(1.2, r * m.sz);
          ctx.globalAlpha = alpha * 0.9;
          ctx.fillStyle = "#e2e8f0";
          ctx.beginPath();
          ctx.arc(mx, my, mr, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = alpha * 0.35;
          ctx.fillStyle = "#64748b";
          ctx.beginPath();
          ctx.arc(mx - mr * 0.3, my - mr * 0.3, mr * 0.55, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      function paintSurface(n, r, alpha) {
        const dec = nodeDecor(n);
        const bands = n.domain === "commerce";
        if (!dec.craters.length && !bands) return;
        ctx.save();
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, r, 0, TAU);
        ctx.clip();
        ctx.globalAlpha = alpha;
        if (bands) {
          for (let i = -2; i <= 2; i++) {
            ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.08)";
            ctx.fillRect(n.sx - r, n.sy + i * r * 0.34 - r * 0.09, r * 2, r * 0.18);
          }
        }
        for (const c of dec.craters) {
          const cx = n.sx + c.x * r, cy = n.sy + c.y * r, cr = c.r * r;
          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.10)";
          ctx.beginPath();
          ctx.arc(cx - cr * 0.25, cy - cr * 0.25, cr * 0.7, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      const isDimmed = (n) => {
        if (n.isFlo) return false;
        if (activeFilter) {
          const miss =
            activeFilter.kind === "domain"
              ? n.domain !== activeFilter.key
              : !n.techs.includes(activeFilter.key);
          if (miss) return true;
        }
        return !!searchQuery && !n.searchText.includes(searchQuery);
      };

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const night = document.body.classList.contains("night");
        if (night) {
          const t = performance.now() / 1000;
          for (const st of stars) {
            const a = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * st.s + st.p));
            ctx.fillStyle = st.warm ? `rgba(253,230,138,${a})` : `rgba(203,213,225,${a})`;
            ctx.beginPath();
            ctx.arc(st.x * W, st.y * H, st.r, 0, TAU);
            ctx.fill();
          }
        }

        if (!dragging) {
          if (camAnim) {
            yaw += (camAnim.ty - yaw) * 0.07;
            pitch += (camAnim.tp - pitch) * 0.07;
            if (Math.abs(camAnim.ty - yaw) < 0.003 && Math.abs(camAnim.tp - pitch) < 0.003) camAnim = null;
          }
          yaw += vyaw;
          pitch += vpitch;
          vyaw *= 0.96;
          vpitch *= 0.96;
          pitch = Math.max(-1.45, Math.min(1.45, pitch));
          if (autoSpin && !activeFilter && !searchQuery && !camAnim && performance.now() - lastInteract > 4000) {
            yaw += 0.0012;
            if (targetZoom !== ZOOM0) targetZoom = ZOOM0;
          }
        }
        zoom += (targetZoom - zoom) * 0.1;

        nodes.forEach((n) => {
          const pr = project(n.pos);
          n.sx = pr.x; n.sy = pr.y; n.depth = pr.z;
          n.px = n.wr * pr.s * pr.Rpx;
        });

        // recentrage : la bounding box des nœuds visibles reste centrée à l'écran
        {
          let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
          for (const n of nodes) {
            if (isDimmed(n)) continue;
            if (n.sx < x0) x0 = n.sx;
            if (n.sx > x1) x1 = n.sx;
            if (n.sy - n.px - 20 < y0) y0 = n.sy - n.px - 20; // place pour le label au-dessus
            if (n.sy + n.px + 4 > y1) y1 = n.sy + n.px + 4;
          }
          viewOX += (W / 2 - (x0 + x1) / 2) * 0.05;
          viewOY += (H / 2 - (y0 + y1) / 2 + 3) * 0.05; // +3 : marge haute pour les labels

          // zoom-out doux si le contenu (labels inclus) dépasse l'écran.
          // La bbox est mesuree en espace unitaire (zoom = fitScale = 1) :
          // sinon fitScale absorberait le zoom avant de l'utilisateur,
          // rendant tout zoom-in impossible.
          const unit = zoom * fitScale;
          let ux0 = 1e9, ux1 = -1e9, uy0 = 1e9, uy1 = -1e9;
          for (const n of nodes) {
            if (isDimmed(n)) continue;
            const nx = (n.sx - W / 2 - viewOX) / unit;
            const ny = (n.sy - H / 2 - viewOY) / unit;
            const nr = n.px / unit;
            if (nx < ux0) ux0 = nx;
            if (nx > ux1) ux1 = nx;
            if (ny - nr - 20 / unit < uy0) uy0 = ny - nr - 20 / unit;
            if (ny + nr + 4 / unit > uy1) uy1 = ny + nr + 4 / unit;
          }
          const fit = Math.min(
            1,
            (W - 70) / Math.max(1, ux1 - ux0),
            (H - 30) / Math.max(1, uy1 - uy0)
          );
          fitScale += (fit - fitScale) * 0.05;
        }

        // edges
        ctx.lineWidth = 1;
        for (const e of edges) {
          const a = nodes[e.a], b = nodes[e.b];
          const dimA = isDimmed(a), dimB = isDimmed(b);
          if ((activeFilter || searchQuery) && dimA && dimB) continue;
          const depthFade = Math.min(1, Math.max(0.15, (a.depth + b.depth + 2) / 4));

          if (e.flo) {
            // spokes vers Flo : visibles seulement vers les noeuds filtrés/recherchés
            if (activeFilter || searchQuery) {
              if (dimB) continue;
              ctx.strokeStyle = `rgba(100,116,139,${0.28 * depthFade})`;
            } else {
              ctx.strokeStyle = `rgba(148,163,184,${0.12 * depthFade})`;
            }
            ctx.setLineDash([]);
          } else if (e.chrono) {
            ctx.strokeStyle = `rgba(148,163,184,${0.35 * depthFade * (dimA || dimB ? 0.3 : 1)})`;
            ctx.setLineDash([3, 4]);
          } else {
            const ca = hexRgb(a.isFlo ? "#94a3b8" : a.color);
            const cb = hexRgb(b.isFlo ? "#94a3b8" : b.color);
            const t = 0.5;
            const cr = ca.map((v, i) => Math.round(lerp(v, cb[i], t)));
            const alpha = Math.min(0.4, 0.05 + e.w * 0.09) * depthFade * (dimA || dimB ? 0.25 : 1);
            ctx.strokeStyle = `rgba(${cr.join(",")},${alpha})`;
            ctx.setLineDash([]);
          }
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          const mx = (a.sx + b.sx) / 2, my = (a.sy + b.sy) / 2;
          const dx = b.sx - a.sx, dy = b.sy - a.sy;
          const len = Math.hypot(dx, dy) || 1;
          const bow = e.flo ? 0 : Math.min(14, len * 0.12) * (e.chrono ? 0.4 : 1);
          ctx.quadraticCurveTo(mx - (dy / len) * bow, my + (dx / len) * bow, b.sx, b.sy);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        // nodes back-to-front
        const order = nodes.map((n, i) => i).sort((a, b) => nodes[a].depth - nodes[b].depth);
        const frontness = (d) => Math.max(0, Math.min(1, (d + 1) / 2));

        for (const i of order) {
          const n = nodes[i];
          const facing = n.isFlo ? 1 : frontness(n.depth);
          const eraAlpha = n.isFlo || n.end === "now" || n.domain === "pro" ? 1 : Math.max(0.35, 1 - (NOW - parseDate(n.end)) / 31557600000 / 14);
          let alpha = (0.3 + 0.7 * facing) * eraAlpha;
          const dimmed = isDimmed(n);
          if (dimmed) alpha *= 0.07;
          const emph = (activeFilter || searchQuery) && !dimmed && !n.isFlo;
          const r = Math.max(1.6, n.px) * (emph ? 1.18 : 1);

          if (n.active || n.isFlo) {
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 3.5, 0, TAU);
            ctx.strokeStyle = `rgba(255,255,255,${0.9 * alpha})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 1.5, 0, TAU);
            ctx.strokeStyle = night && n.isFlo ? "#fbbf24" : n.color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          if (night && n.isFlo) {
            // Flo = étoile centrale : halo + noyau
            const g = ctx.createRadialGradient(n.sx, n.sy, 0, n.sx, n.sy, r * 3.6);
            g.addColorStop(0, "rgba(255,251,235,0.95)");
            g.addColorStop(0.25, "rgba(253,224,71,0.8)");
            g.addColorStop(0.6, "rgba(245,158,11,0.22)");
            g.addColorStop(1, "rgba(245,158,11,0)");
            ctx.globalAlpha = alpha;
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r * 3.6, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r, 0, TAU);
            ctx.fillStyle = "#fffbeb";
            ctx.fill();
            ctx.globalAlpha = 1;
          } else {
            const dec = night ? nodeDecor(n) : null;
            if (dec) {
              if (n.domain === "finance") paintRing(n, r, alpha, false);
              paintMoons(n, r, alpha, false);
            }
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r, 0, TAU);
            ctx.fillStyle = night ? planetGradient(n, n.sx, n.sy, r) : n.color;
            ctx.globalAlpha = alpha;
            if (n.active || n.isFlo || emph) {
              ctx.shadowColor = n.color;
              ctx.shadowBlur = emph ? 16 : n.isFlo ? 14 : 8 * facing;
            }
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            if (dec) {
              paintSurface(n, r, alpha);
              if (n.domain === "finance") paintRing(n, r, alpha, true);
              paintMoons(n, r, alpha, true);
            }
          }

          if (emph) {
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 4, 0, TAU);
            ctx.strokeStyle = n.color;
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          if ((i === hovered && !dimmed) || n.isFlo) {
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 5, 0, TAU);
            ctx.strokeStyle = night ? "#e2e8f0" : "#0f172a";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }

        // labels
        ctx.font = "11px Helvetica Neue, sans-serif";
        ctx.textAlign = "center";
        for (const n of nodes) {
          const isMajor = n.isFlo || n.commits >= 600 || n.active || n.domain === "pro";
          const isFiltered = (activeFilter || searchQuery) && !isDimmed(n);
          const labelOk = n.domain === "pro" || n.depth > 0.15;
          if (!isFiltered && n !== nodes[hovered] && !n.isFlo && !(isMajor && labelOk)) continue;
          if (isDimmed(n)) continue;
          const facing = n.isFlo ? 1 : frontness(n.depth);
          const alpha = n.isFlo
            ? 1
            : (isFiltered ? Math.max(0.6, Math.min(1, facing * 1.6)) : Math.min(1, facing * 1.4)) *
              (n.end === "now" ? 1 : 0.6);
          if (alpha < 0.25) continue;
          ctx.fillStyle = n.isFlo
            ? night
              ? "#fde68a"
              : "#0f172a"
            : `rgba(${night ? "226,232,240" : "30,41,59"},${alpha})`;
          ctx.font = n.isFlo ? "bold 12px Helvetica Neue, sans-serif" : "11px Helvetica Neue, sans-serif";
          ctx.fillText(n.name, Math.max(40, Math.min(W - 40, n.sx)), n.sy - n.px - 8);
        }

        requestAnimationFrame(draw);
      }
      draw();

      /* ---- interactions ---- */
      function canvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return [e.clientX - rect.left, e.clientY - rect.top];
      }

      function hitTest(x, y) {
        let best = -1, bestD = 1e9;
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (isDimmed(n)) continue;
          const d = Math.hypot(n.sx - x, n.sy - y);
          const thr = Math.max(10, n.px + 6);
          if (d < thr && d < bestD) { best = i; bestD = d; }
        }
        return best;
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "mouse" && !e.isPrimary) return;
        dragging = true;
        camAnim = null;
        canvas.classList.add("dragging");
        canvas.setPointerCapture(e.pointerId);
        [lastX, lastY] = canvasPos(e);
        downX = lastX; downY = lastY; downT = performance.now();
        vyaw = vpitch = 0;
        lastInteract = performance.now();
      });

      canvas.addEventListener("pointermove", (e) => {
        if (dragging && e.pointerType !== "mouse" && !e.isPrimary) return;
        const [x, y] = canvasPos(e);
        if (dragging) {
          const dx = x - lastX, dy = y - lastY;
          vyaw = dx * 0.005;
          vpitch = dy * 0.004;
          yaw += vyaw;
          pitch = Math.max(-1.45, Math.min(1.45, pitch + vpitch));
          lastX = x; lastY = y;
          lastInteract = performance.now();
          hovered = -1;
        } else {
          const h = hitTest(x, y);
          if (h !== hovered) {
            hovered = h;
            canvas.style.cursor = h >= 0 ? "pointer" : "grab";
          }
        }
      });

      function endDrag(e) {
        if (!dragging || (e.pointerType !== "mouse" && !e.isPrimary)) return;
        dragging = false;
        canvas.classList.remove("dragging");
        lastInteract = performance.now();
        const [x, y] = canvasPos(e);
        const moved = Math.hypot(x - downX, y - downY);
        const dt = performance.now() - downT;
        if (moved < 8 && dt < 500) {
          const h = hitTest(x, y);
          if (h >= 0) {
            if (nodes[h].isFlo) openProfile();
            else openPopup(nodes[h]);
          } else {
            clearFilter();
            targetZoom = ZOOM0; // remise du zoom standard
          }
        }
      }
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        targetZoom = Math.max(0.55, Math.min(1.9, targetZoom * (e.deltaY > 0 ? 0.92 : 1.09)));
        lastInteract = performance.now();
      }, { passive: false });

      let pinchDist = 0;
      canvas.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const d = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (pinchDist > 0) {
            targetZoom = Math.max(0.55, Math.min(1.9, targetZoom * (d / pinchDist)));
          }
          pinchDist = d;
        }
      }, { passive: false });
      canvas.addEventListener("touchend", () => (pinchDist = 0));

      /* ---- filtre ---- */
      function syncLegend() {
        document.querySelectorAll(".legend-item").forEach((el) => {
          el.classList.toggle(
            "active",
            !!activeFilter && el.dataset.fkind === activeFilter.kind && el.dataset.fkey === activeFilter.key
          );
        });
      }
      function toggleFilter(kind, key) {
        const same = activeFilter && activeFilter.kind === kind && activeFilter.key === key;
        activeFilter = same ? null : { kind, key };
        syncLegend();
        if (activeFilter || searchQuery) {
          focusFilter();
        } else {
          camAnim = null;
          targetZoom = ZOOM0;
          lastInteract = performance.now() - 6000; // la rotation reprend
        }
      }
      function clearFilter() {
        const had = activeFilter || searchQuery || searchOpen;
        if (!had) return;
        activeFilter = null;
        searchQuery = "";

        searchBtn.classList.remove("active");

      /* ---- caméra : recentrer sur le filtre ---- */
      function focusFilter() {
        if (!activeFilter && !searchQuery) return;
        let sx = 0, sy = 0, sz = 0, count = 0;
        const vis = [];
        for (const n of nodes) {
          if (!isDimmed(n) && !n.isFlo) {
            sx += n.pos[0]; sy += n.pos[1]; sz += n.pos[2];
            vis.push(n);
            count++;
          }
        }
        if (!count) return;
        const l = Math.hypot(sx, sy, sz) || 1;
        sx /= l; sy /= l; sz /= l;
        let ty = Math.atan2(-sx, sz);
        while (ty - yaw > Math.PI) ty -= TAU;
        while (ty - yaw < -Math.PI) ty += TAU;
        let tp = Math.atan2(sy, Math.hypot(sx, sz));
        if (count === 1) {
          // un seul resultat : decaler la visee pour ne pas le superposer a Flojito
          ty += 0.24;
          tp -= 0.12;
        }
        tp = Math.max(-1.45, Math.min(1.45, tp));
        camAnim = { ty, tp };
        vyaw = vpitch = 0;

        // zoom pour que TOUS les points filtrés tiennent à l'écran
        const cy = Math.cos(ty), syw = Math.sin(ty);
        const cp = Math.cos(tp), sp = Math.sin(tp);
        let maxE = 0;
        for (const n of vis) {
          const x1 = n.pos[0] * cy + n.pos[2] * syw;
          const z1 = -n.pos[0] * syw + n.pos[2] * cy;
          const y1 = n.pos[1];
          const vx = x1, vy = y1 * cp - z1 * sp, vz = y1 * sp + z1 * cp;
          const sc = CAM / (CAM - vz);
          maxE = Math.max(maxE, Math.hypot(vx * sc, vy * sc));
        }
        if (maxE > 0) {
          targetZoom = Math.max(0.55, Math.min(1.9, 0.44 / (0.5 * maxE)));
        }
      }

          <div class="meta-line"><span class="lbl">GIT</span><span>${PROFILE.links.map(([l, u]) => `<a href="${u}" target="_blank" style="color:#007bff;font-weight:bold;">${l}</a>`).join(" · ")}</span></div>
          <div class="modal-section"><h4>Parcours</h4><p>${PROJECTS.length} projets & expériences — ${totalCommits.toLocaleString("fr-FR")} commits — ${years} ans de code</p></div>
          <div class="modal-section"><h4>Formation</h4>${PROFILE.formation.map(([a, b]) => `<p style="margin-bottom:8px;">• <b>${a}</b><br><span style="color:#64748b;">${b}</span></p>`).join("")}</div>
          <div class="modal-section"><h4>Langues</h4><p>${PROFILE.languages}</p></div>
          <div class="modal-section"><h4>Passions</h4><p>${PROFILE.passions}</p></div>
        `;
        modal.style.display = "flex";
      }

      function toggleMap() {
        const w = document.getElementById("mapWrap");
        if (!w) return;
        const open = w.style.display === "none";
        w.style.display = open ? "block" : "none";
        const chev = document.getElementById("mapChev");
        if (chev) chev.className = open ? "ti ti-chevron-up" : "ti ti-chevron-down";
      }

      function closeModal() {
        document.getElementById("popupModal").style.display = "none";
      }
      document.getElementById("popupModal").addEventListener("click", (e) => {
        if (e.target.id === "popupModal") closeModal();
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeModal();
          togglePanel(false);
          psheetOverlay.classList.remove("open");
        }
      });
    </script>
  </body>
</html>
