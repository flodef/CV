      const ctx = canvas.getContext("2d");
      const TAU = Math.PI * 2;
      const NOW = Date.now();

      const parseDate = (s) => (s === "now" ? NOW : Date.parse(s + "-01"));
      const months = (a, b) => Math.max(1, Math.round((b - a) / 2628000000));
      const fmtDate = (s) => {
        const [y, m] = s.split("-");
        const names = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
        return names[+m - 1] + " " + y;
      };
      const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
      const lerp = (a, b, t) => a + (b - a) * t;

      // ---- nodes ----
      const domainKeys = Object.keys(DOMAINS);
      const domainIndex = {};
      domainKeys.forEach((k, i) => (domainIndex[k] = i));

      let seed = 42;
      const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

      const centers = domainKeys.map((_, i) => {
        const y = 1 - (i / (domainKeys.length - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const th = i * 2.399963;
        return [Math.cos(th) * r, y, Math.sin(th) * r];
      });
      const bases = centers.map((c) => {
        const up = Math.abs(c[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
        let u = [
          up[1] * c[2] - up[2] * c[1],
          up[2] * c[0] - up[0] * c[2],
          up[0] * c[1] - up[1] * c[0],
        ];
        const ul = Math.hypot(...u) || 1;
        u = u.map((v) => v / ul);
        const v = [
          c[1] * u[2] - c[2] * u[1],
          c[2] * u[0] - c[0] * u[2],
          c[0] * u[1] - c[1] * u[0],
        ];
        return [u, v];
      });

      const byDomain = {};
      PROJECTS.forEach((p) => {
        (byDomain[p.domain] = byDomain[p.domain] || []).push(p);
      });
      Object.values(byDomain).forEach((arr) =>
        arr.sort((a, b) => parseDate(a.start) - parseDate(b.start))
      );

      const nodes = PROJECTS.map((p) => {
        const di = domainIndex[p.domain];
        const list = byDomain[p.domain];
        const idx = list.indexOf(p);
        const n = list.length;
        const spread = 0.16 + 0.62 * Math.sqrt(idx / Math.max(1, n - 1));
        const ang = idx * 2.399963 + rand() * 0.6;
        const [u, v] = bases[di];
        const c = centers[di];
        const jx = (rand() - 0.5) * 0.08, jy = (rand() - 0.5) * 0.08, jz = (rand() - 0.5) * 0.08;
        let pos = [
          c[0] + (u[0] * Math.cos(ang) + v[0] * Math.sin(ang)) * spread + jx,
          c[1] + (u[1] * Math.cos(ang) + v[1] * Math.sin(ang)) * spread + jy,
          c[2] + (u[2] * Math.cos(ang) + v[2] * Math.sin(ang)) * spread + jz,
        ];
        const pl = Math.hypot(...pos);
        pos = pos.map((x) => x / pl);

        const endT = parseDate(p.end);
        const ageYears = Math.max(0, (NOW - endT) / 31557600000);
        const radiusFactor = 0.68 + 0.32 / (1 + ageYears / 5);
        pos = pos.map((x) => x * radiusFactor);

        const wr = p.w ?? 0.009 + 0.028 * Math.sqrt((p.commits || 0) / 2000);
        return {
          ...p,
          pos,
          radiusFactor,
          wr,
          color: DOMAINS[p.domain].color,
          isFlo: false,
          sx: 0, sy: 0, depth: 0, px: 0,
        };
      });

      // ---- Flo au centre, relié à tout ----
      const FLO_IDX = nodes.length;
      nodes.push({
        name: "Flojito",
        pos: [0, 0, 0],
        wr: 0.034,
        color: "#0f172a",
        isFlo: true,
        end: "now",
        domain: "flo",
        sx: 0, sy: 0, depth: 0, px: 0,
      });

      // ---- edges ----
      const edges = [];
      const nodeIdx = {};
      nodes.forEach((n, i) => (nodeIdx[n.name] = i));

      Object.values(byDomain).forEach((list) => {
        for (let i = 0; i < list.length - 1; i++) {
          const a = nodeIdx[list[i].name], b = nodeIdx[list[i + 1].name];
          const shared = list[i].techs.filter((t) => list[i + 1].techs.includes(t));
          edges.push({ a, b, w: 1 + Math.min(1.5, shared.length * 0.5), chrono: false, flo: false });
        }
      });
      for (let i = 0; i < FLO_IDX; i++) {
        for (let j = i + 1; j < FLO_IDX; j++) {
          if (nodes[i].domain === nodes[j].domain) continue;
          const shared = nodes[i].techs.filter((t) => nodes[j].techs.includes(t));
          if (shared.length >= 2) {
            edges.push({ a: i, b: j, w: 0.8 + shared.length * 0.4, chrono: false, flo: false });
          }
        }
      }
      const chronoSorted = [...nodes.slice(0, FLO_IDX)].sort(
        (a, b) => parseDate(a.start) - parseDate(b.start)
      );
      for (let i = 0; i < chronoSorted.length - 1; i++) {
        edges.push({
          a: nodeIdx[chronoSorted[i].name],
          b: nodeIdx[chronoSorted[i + 1].name],
          w: 0.35,
          chrono: true,
          flo: false,
        });
      }
      // spokes Flo → chaque projet
      for (let i = 0; i < FLO_IDX; i++) {
        edges.push({ a: FLO_IDX, b: i, w: 0.2, chrono: false, flo: true });
      }

      /* ---- état ---- */
      let W = 0, H = 0, DPR = 1;
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.clientWidth;
        H = canvas.clientHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      const YAW0 = 0.8, PITCH0 = 0.2, ZOOM0 = 1;
      let yaw = YAW0, pitch = PITCH0;
      let vyaw = 0, vpitch = 0;
      const CAM = 3;
      let zoom = ZOOM0, targetZoom = ZOOM0;
      let autoSpin = true;
      let lastInteract = 0;
      let hovered = -1;
      let activeFilter = null; // { kind: 'domain'|'tech', key } | null
      let camAnim = null;
      let dragging = false;
      let lastX = 0, lastY = 0, downX = 0, downY = 0, downT = 0;

      function rotatePoint(p) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        let x = p[0] * cy + p[2] * sy;
        let z = -p[0] * sy + p[2] * cy;
        let y = p[1];
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const y2 = y * cp - z * sp;
        const z2 = y * sp + z * cp;
        return [x, y2, z2];
      }

      function project(p) {
        const r = rotatePoint(p);
        const s = CAM / (CAM - r[2]);
        const Rpx = Math.min(W, H) * 0.38 * zoom;
        return {
          x: W / 2 + r[0] * s * Rpx,
          y: H / 2 - r[1] * s * Rpx,
          z: r[2],
          s,
          Rpx,
        };
      }

      const isDimmed = (n) => {
        if (!activeFilter || n.isFlo) return false;
        return activeFilter.kind === "domain"
          ? n.domain !== activeFilter.key
          : !n.techs.includes(activeFilter.key);
      };

      function draw() {
        ctx.clearRect(0, 0, W, H);

        if (!dragging) {
          if (camAnim) {
            yaw += (camAnim.ty - yaw) * 0.07;
            pitch += (camAnim.tp - pitch) * 0.07;
            if (Math.abs(camAnim.ty - yaw) < 0.003 && Math.abs(camAnim.tp - pitch) < 0.003) camAnim = null;
          }
          yaw += vyaw;
          pitch += vpitch;
          vyaw *= 0.96;
          vpitch *= 0.96;
          pitch = Math.max(-1.45, Math.min(1.45, pitch));
          if (autoSpin && !activeFilter && !camAnim && performance.now() - lastInteract > 4000) yaw += 0.0012;
        }
        zoom += (targetZoom - zoom) * 0.1;

        nodes.forEach((n) => {
          const pr = project(n.pos);
          n.sx = pr.x; n.sy = pr.y; n.depth = pr.z;
          n.px = n.wr * pr.s * pr.Rpx;
        });

        // edges
        ctx.lineWidth = 1;
        for (const e of edges) {
          const a = nodes[e.a], b = nodes[e.b];
          const dimA = isDimmed(a), dimB = isDimmed(b);
          if (activeFilter && dimA && dimB) continue;
          const depthFade = Math.min(1, Math.max(0.15, (a.depth + b.depth + 2) / 4));

          if (e.flo) {
            // spokes vers Flo : visibles seulement vers le domaine filtré
            if (activeFilter) {
              if (dimB) continue;
              ctx.strokeStyle = `rgba(100,116,139,${0.28 * depthFade})`;
            } else {
              ctx.strokeStyle = `rgba(148,163,184,${0.12 * depthFade})`;
            }
            ctx.setLineDash([]);
          } else if (e.chrono) {
            ctx.strokeStyle = `rgba(148,163,184,${0.35 * depthFade * (dimA || dimB ? 0.3 : 1)})`;
            ctx.setLineDash([3, 4]);
          } else {
            const ca = hexRgb(a.isFlo ? "#94a3b8" : a.color);
            const cb = hexRgb(b.isFlo ? "#94a3b8" : b.color);
            const t = 0.5;
            const cr = ca.map((v, i) => Math.round(lerp(v, cb[i], t)));
            const alpha = Math.min(0.4, 0.05 + e.w * 0.09) * depthFade * (dimA || dimB ? 0.25 : 1);
            ctx.strokeStyle = `rgba(${cr.join(",")},${alpha})`;
            ctx.setLineDash([]);
          }
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          const mx = (a.sx + b.sx) / 2, my = (a.sy + b.sy) / 2;
          const dx = b.sx - a.sx, dy = b.sy - a.sy;
          const len = Math.hypot(dx, dy) || 1;
          const bow = e.flo ? 0 : Math.min(14, len * 0.12) * (e.chrono ? 0.4 : 1);
          ctx.quadraticCurveTo(mx - (dy / len) * bow, my + (dx / len) * bow, b.sx, b.sy);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        // nodes back-to-front
        const order = nodes.map((n, i) => i).sort((a, b) => nodes[a].depth - nodes[b].depth);
        const frontness = (d) => Math.max(0, Math.min(1, (d + 1) / 2));

        for (const i of order) {
          const n = nodes[i];
          const facing = n.isFlo ? 1 : frontness(n.depth);
          const eraAlpha = n.isFlo || n.end === "now" ? 1 : Math.max(0.35, 1 - (NOW - parseDate(n.end)) / 31557600000 / 14);
          let alpha = (0.3 + 0.7 * facing) * eraAlpha;
          const dimmed = isDimmed(n);
          if (dimmed) alpha *= 0.07;
          const emph = activeFilter && !dimmed && !n.isFlo;
          const r = Math.max(1.6, n.px) * (emph ? 1.18 : 1);

          if (n.active || n.isFlo) {
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 3.5, 0, TAU);
            ctx.strokeStyle = `rgba(255,255,255,${0.9 * alpha})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 1.5, 0, TAU);
            ctx.strokeStyle = n.color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          ctx.beginPath();
          ctx.arc(n.sx, n.sy, r, 0, TAU);
          ctx.fillStyle = n.color;
          ctx.globalAlpha = alpha;
          if (n.active || n.isFlo || emph) {
            ctx.shadowColor = n.color;
            ctx.shadowBlur = emph ? 16 : n.isFlo ? 14 : 8 * facing;
          }
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;

          if (emph) {
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 4, 0, TAU);
            ctx.strokeStyle = n.color;
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          if ((i === hovered && !dimmed) || n.isFlo) {
            ctx.beginPath();
            ctx.arc(n.sx, n.sy, r + 5, 0, TAU);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }

        // labels
        ctx.font = "11px Helvetica Neue, sans-serif";
        ctx.textAlign = "center";
        for (const n of nodes) {
          const isMajor = n.isFlo || n.commits >= 600 || n.active;
          const isFiltered = activeFilter && !isDimmed(n);
          if (!isFiltered && n !== nodes[hovered] && !n.isFlo && !(isMajor && n.depth > 0.15)) continue;
          if (isDimmed(n)) continue;
          const facing = n.isFlo ? 1 : frontness(n.depth);
          const alpha = n.isFlo
            ? 1
            : (isFiltered ? Math.max(0.6, Math.min(1, facing * 1.6)) : Math.min(1, facing * 1.4)) *
              (n.end === "now" ? 1 : 0.6);
          if (alpha < 0.25) continue;
          ctx.fillStyle = n.isFlo ? "#0f172a" : `rgba(30,41,59,${alpha})`;
          ctx.font = n.isFlo ? "bold 12px Helvetica Neue, sans-serif" : "11px Helvetica Neue, sans-serif";
          ctx.fillText(n.name, n.sx, n.sy - n.px - 8);
        }

        requestAnimationFrame(draw);
      }
      draw();

      /* ---- interactions ---- */
      function canvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return [e.clientX - rect.left, e.clientY - rect.top];
      }

      function hitTest(x, y) {
        let best = -1, bestD = 1e9;
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (isDimmed(n)) continue;
          const d = Math.hypot(n.sx - x, n.sy - y);
          const thr = Math.max(10, n.px + 6);
          if (d < thr && d < bestD) { best = i; bestD = d; }
        }
        return best;
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "mouse" && !e.isPrimary) return;
        dragging = true;
        camAnim = null;
        canvas.classList.add("dragging");
        canvas.setPointerCapture(e.pointerId);
        [lastX, lastY] = canvasPos(e);
        downX = lastX; downY = lastY; downT = performance.now();
        vyaw = vpitch = 0;
        lastInteract = performance.now();
      });

      canvas.addEventListener("pointermove", (e) => {
        if (dragging && e.pointerType !== "mouse" && !e.isPrimary) return;
        const [x, y] = canvasPos(e);
        if (dragging) {
          const dx = x - lastX, dy = y - lastY;
          vyaw = -dx * 0.005;
          vpitch = -dy * 0.004;
          yaw += vyaw;
          pitch = Math.max(-1.45, Math.min(1.45, pitch + vpitch));
          lastX = x; lastY = y;
          lastInteract = performance.now();
          hovered = -1;
        } else {
          const h = hitTest(x, y);
          if (h !== hovered) {
            hovered = h;
            canvas.style.cursor = h >= 0 ? "pointer" : "grab";
          }
        }
      });

      function endDrag(e) {
        if (!dragging || (e.pointerType !== "mouse" && !e.isPrimary)) return;
        dragging = false;
        canvas.classList.remove("dragging");
        lastInteract = performance.now();
        const [x, y] = canvasPos(e);
        const moved = Math.hypot(x - downX, y - downY);
        const dt = performance.now() - downT;
        if (moved < 8 && dt < 500) {
          const h = hitTest(x, y);
          if (h >= 0) {
            if (nodes[h].isFlo) openProfile();
            else openPopup(nodes[h]);
          } else {
            clearFilter();
            targetZoom = ZOOM0; // remise du zoom standard
          }
        }
      }
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        targetZoom = Math.max(0.55, Math.min(1.9, targetZoom * (e.deltaY > 0 ? 0.92 : 1.09)));
        lastInteract = performance.now();
      }, { passive: false });

      let pinchDist = 0;
      canvas.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const d = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (pinchDist > 0) {
            targetZoom = Math.max(0.55, Math.min(1.9, targetZoom * (pinchDist / d)));
          }
          pinchDist = d;
        }
      }, { passive: false });
      canvas.addEventListener("touchend", () => (pinchDist = 0));

      /* ---- filtre ---- */
      function syncLegend() {
        document.querySelectorAll(".legend-item").forEach((el) => {
          el.classList.toggle(
            "active",
            !!activeFilter && el.dataset.fkind === activeFilter.kind && el.dataset.fkey === activeFilter.key
          );
        });
      }
      function toggleFilter(kind, key) {
        const same = activeFilter && activeFilter.kind === kind && activeFilter.key === key;
        activeFilter = same ? null : { kind, key };
        syncLegend();
        if (activeFilter) {
          focusFilter();
        } else {
          camAnim = null;
          lastInteract = performance.now() - 6000; // la rotation reprend
        }
      }
      function clearFilter() {
        if (!activeFilter) return;
        activeFilter = null;
        syncLegend();
        camAnim = null;
        lastInteract = performance.now() - 6000;
      }

      /* ---- caméra : recentrer sur le filtre ---- */
      function focusFilter() {
        if (!activeFilter) return;
        let sx = 0, sy = 0, sz = 0, count = 0;
        const vis = [];
        for (const n of nodes) {
          if (!isDimmed(n) && !n.isFlo) {
            sx += n.pos[0]; sy += n.pos[1]; sz += n.pos[2];
            vis.push(n);
            count++;
          }
        }
        if (!count) return;
        const l = Math.hypot(sx, sy, sz) || 1;
        sx /= l; sy /= l; sz /= l;
        let ty = Math.atan2(-sx, sz);
        while (ty - yaw > Math.PI) ty -= TAU;
        while (ty - yaw < -Math.PI) ty += TAU;
        const tp = Math.max(-1.45, Math.min(1.45, Math.atan2(sy, Math.hypot(sx, sz))));
        camAnim = { ty, tp };
        vyaw = vpitch = 0;

        // zoom pour que TOUS les points filtrés tiennent à l'écran
        const cy = Math.cos(ty), syw = Math.sin(ty);
        const cp = Math.cos(tp), sp = Math.sin(tp);
        let maxE = 0;
        for (const n of vis) {
          const x1 = n.pos[0] * cy + n.pos[2] * syw;
          const z1 = -n.pos[0] * syw + n.pos[2] * cy;
          const y1 = n.pos[1];
          const vx = x1, vy = y1 * cp - z1 * sp, vz = y1 * sp + z1 * cp;
          const sc = CAM / (CAM - vz);
          maxE = Math.max(maxE, Math.hypot(vx * sc, vy * sc));
        }
        if (maxE > 0) {
          targetZoom = Math.max(0.55, Math.min(1.9, 0.44 / (0.38 * maxE)));
        }
      }

      /* ---- panneau ---- */
      const infoBtn = document.getElementById("infoBtn");
      const infoPanel = document.getElementById("infoPanel");
      function togglePanel(force) {
        const open = force !== undefined ? force : !infoPanel.classList.contains("open");
        infoPanel.classList.toggle("open", open);
      }
      infoBtn.addEventListener("click", () => togglePanel());

      document.getElementById("resetBtn").addEventListener("click", () => {
        yaw = YAW0; pitch = PITCH0; targetZoom = ZOOM0; zoom = ZOOM0;
        vyaw = vpitch = 0;
        camAnim = null;
        lastInteract = performance.now();
      });

      const spinBtn = document.getElementById("spinBtn");
      spinBtn.addEventListener("click", () => {
        autoSpin = !autoSpin;
        spinBtn.innerHTML = autoSpin
          ? '<i class="ti ti-player-pause"></i> Rotation auto : ON'
          : '<i class="ti ti-player-play"></i> Rotation auto : OFF';
      });

      /* ---- légende ---- */
      const legendDom = document.getElementById("legendDomains");
      for (const [key, d] of Object.entries(DOMAINS)) {
        const btn = document.createElement("button");
        btn.className = "legend-item";
        btn.dataset.fkind = "domain";
        btn.dataset.fkey = key;
        btn.innerHTML = `<span class="legend-dot" style="background:${d.color}"></span>${d.label}`;
        btn.addEventListener("click", () => toggleFilter("domain", key));
        legendDom.appendChild(btn);
      }
      const legendTech = document.getElementById("legendTechs");
      // tri par fréquence d'utilisation dans les projets
      const techCount = {};
      PROJECTS.forEach((p) => p.techs.forEach((t) => (techCount[t] = (techCount[t] || 0) + 1)));
      Object.keys(techCount)
        .sort((a, b) => techCount[b] - techCount[a])
        .forEach((key) => {
          const t = TECHS[key];
          if (!t) return;
          const btn = document.createElement("button");
          btn.className = "legend-item";
          btn.dataset.fkind = "tech";
          btn.dataset.fkey = key;
          btn.innerHTML = `<span class="legend-dot" style="background:${t.color}"></span>${t.label}`;
          btn.addEventListener("click", () => toggleFilter("tech", key));
          legendTech.appendChild(btn);
        });

      /* ---- accordéon du panneau ---- */
      document.querySelectorAll("#infoPanel .acc-head").forEach((head) => {
        head.addEventListener("click", () => {
          const acc = head.parentElement;
          const wasOpen = acc.classList.contains("open");
          document.querySelectorAll("#infoPanel .acc").forEach((a) => a.classList.remove("open"));
          if (!wasOpen) acc.classList.add("open");
        });
      });

      /* ---- popups ---- */
      function durStr(start, end) {
        const m = months(parseDate(start), parseDate(end));
        const y = Math.floor(m / 12), mo = m % 12;
        const parts = [];
        if (y) parts.push(y + " an" + (y > 1 ? "s" : ""));
        if (mo) parts.push(mo + " mois");
        return parts.length ? parts.join(" ") : "< 1 mois";
      }

      function openPopup(n) {
        const modal = document.getElementById("popupModal");
        const d = DOMAINS[n.domain];
        const period =
          fmtDate(n.start) + " → " + (n.end === "now" ? "aujourd'hui" : fmtDate(n.end));
        const techChips = (n.techs || [])
          .filter((t) => TECHS[t])
          .map((t) => {
            const tech = TECHS[t];
            return `<button class="sector-chip" style="padding:2px 10px 2px 7px;font-size:0.8em;" onclick="toggleFilter('tech','${t}');closeModal()"><span class="dot" style="background:${tech.color};width:8px;height:8px;"></span>${tech.label}</button>`;
          })
          .join(" ");
        document.getElementById("popupContent").innerHTML = `
          <div class="modal-label">${n.name}</div>
          ${n.active ? '<div class="active-badge"><span class="pulse-dot"></span>en cours</div>' : ""}
          ${n.commits ? `<div class="modal-sub">${n.commits} commits</div>` : ""}
          <div class="meta-line">
            <span class="lbl">Secteur</span>
            <button class="sector-chip" onclick="toggleFilter('domain','${n.domain}');closeModal()">
              <span class="dot" style="background:${d.color}"></span>${d.label}
            </button>
          </div>
          ${techChips ? `<div class="meta-line"><span class="lbl">Technos</span><span style="display:flex;flex-wrap:wrap;gap:6px;">${techChips}</span></div>` : ""}
          <div class="meta-line"><span class="lbl">Période</span><span>${period}<span class="dur-pre"> — </span><span class="dur">${durStr(n.start, n.end)}</span></span></div>
          ${n.commits ? `<div class="meta-line"><span class="lbl">Commits</span><span>${n.commits}</span></div>` : ""}
          <div class="modal-comment">${n.desc}</div>
          <div class="modal-footer">
            ${n.url ? `<a href="${n.url}" target="_blank">${/github|gitlab|duniter/.test(n.url) ? "Voir le projet" : "Visiter le site"} →</a>` : ""}
          </div>
        `;
        modal.style.display = "flex";
      }

      function openProfile() {
        const modal = document.getElementById("popupModal");
        const totalCommits = PROJECTS.reduce((s, p) => s + (p.commits || 0), 0);
        const minStart = Math.min(...PROJECTS.map((p) => parseDate(p.start)));
        const years = Math.floor((NOW - minStart) / 31557600000);
        const birth = new Date(PROFILE.birth);
        const nowD = new Date();
        let age = nowD.getFullYear() - birth.getFullYear();
        if (
          nowD.getMonth() < birth.getMonth() ||
          (nowD.getMonth() === birth.getMonth() && nowD.getDate() < birth.getDate())
        ) {
          age--;
        }
        document.getElementById("popupContent").innerHTML = `
          <div class="modal-label">${PROFILE.name} <span style="font-size:0.55em;font-weight:normal;color:#64748b;">${age} ans</span></div>
          <div class="modal-sub">${PROFILE.role}</div>
          <div class="modal-sub" style="margin-top:-8px;display:flex;align-items:center;gap:6px;">
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(PROFILE.location + ", France")}" target="_blank" style="color:#64748b;">${PROFILE.location}</a>
            <span class="map-toggle" onclick="toggleMap()" title="Afficher la carte"><i class="ti ti-chevron-down" id="mapChev"></i></span>
          </div>
          <div id="mapWrap" style="display:none;">
            <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(PROFILE.location + ", France")}&z=11&output=embed" style="width:100%;height:170px;border:0;border-radius:8px;margin:4px 0 10px;" loading="lazy" title="Localisation"></iframe>
          </div>
          <div class="meta-line"><span class="lbl">Contact</span><span><a href="mailto:${PROFILE.email}" style="color:#007bff;font-weight:bold;">${PROFILE.email}</a></span></div>
          <div class="meta-line"><span class="lbl">GIT</span><span>${PROFILE.links.map(([l, u]) => `<a href="${u}" target="_blank" style="color:#007bff;font-weight:bold;">${l}</a>`).join(" · ")}</span></div>
          <div class="modal-section"><h4>Parcours</h4><p>${PROJECTS.length} projets & expériences — ${totalCommits.toLocaleString("fr-FR")} commits — ${years} ans de code</p></div>
          <div class="modal-section"><h4>Formation</h4>${PROFILE.formation.map(([a, b]) => `<p style="margin-bottom:8px;">• <b>${a}</b><br><span style="color:#64748b;">${b}</span></p>`).join("")}</div>
          <div class="modal-section"><h4>Langues</h4><p>${PROFILE.languages}</p></div>
          <div class="modal-section"><h4>Passions</h4><p>${PROFILE.passions}</p></div>
        `;
        modal.style.display = "flex";
      }

      function toggleMap() {
        const w = document.getElementById("mapWrap");
        if (!w) return;
        const open = w.style.display === "none";
        w.style.display = open ? "block" : "none";
        const chev = document.getElementById("mapChev");
        if (chev) chev.className = open ? "ti ti-chevron-up" : "ti ti-chevron-down";
      }

      function closeModal() {
        document.getElementById("popupModal").style.display = "none";
      }
      document.getElementById("popupModal").addEventListener("click", (e) => {
        if (e.target.id === "popupModal") closeModal();
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeModal();
          togglePanel(false);
        }
      });
    </script>
  </body>
</html>
